[project]
name = "cheburek-core"
version = "1.0.1"
description = "A core library for the Cheburek text generation bot."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pillow>=12.3.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
